<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudPool</title>
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#17262b;--mute:#5d6f74;--line:#d5dede;--accent:#0d6e6e;--warn:#b3402a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b1e;--panel:#162529;--ink:#e6efee;--mute:#93a8ab;--line:#2a3d41;--accent:#4fc1b6;--warn:#f08a74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.6rem;margin:0}h2{font-size:1.05rem;margin:0 0 12px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
button,.btn{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=password]{width:100%;font:inherit;padding:9px 10px;margin:4px 0 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.bar{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar i{background:var(--accent);display:block}
.big{font-size:2rem;font-weight:600;margin:4px 0 10px}
.mute{color:var(--mute);font-size:.9rem}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.grow{flex:1;min-width:0}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:var(--warn)}
#drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;cursor:pointer}
#drop.on{border-color:var(--accent);background:var(--bg)}
.hide{display:none}
</style>
</head>
<body>
<main>
<header><h1>CloudPool</h1><div id="who" class="hide"><span id="uname" class="mute"></span> <button class="ghost" id="logout">Keluar</button></div></header>

<section id="authBox" class="hide" style="max-width:380px;margin:40px auto">
  <h2 id="authTitle">Masuk</h2>
  <label>Username<input type="text" id="u" autocomplete="username"></label>
  <label>Password<input type="password" id="p" autocomplete="current-password"></label>
  <p class="err" id="authErr"></p>
  <button id="authBtn">Masuk</button>
  <button class="ghost" id="authSwitch">Belum punya akun? Daftar</button>
</section>

<div id="app" class="hide">
  <section>
    <h2>Total penyimpanan</h2>
    <div class="big" id="total">—</div>
    <div class="bar"><i id="totalBar" style="width:0"></i></div>
    <p class="mute" id="totalNote"></p>
  </section>

  <section>
    <h2>Akun Google terhubung</h2>
    <div id="accounts"></div>
    <p><a class="btn" href="/api/google/connect">Hubungkan akun Google</a></p>
    <p class="err" id="topErr"></p>
  </section>

  <section>
    <h2>Unggah file</h2>
    <div id="drop" tabindex="0">Tarik file ke sini atau klik untuk memilih<input type="file" id="file" multiple class="hide"></div>
    <p class="mute" id="prog"></p>
  </section>

  <section>
    <h2>File saya</h2>
    <div id="files"></div>
  </section>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const fmt=b=>{if(b==null)return'—';const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<4){b/=1024;i++}return b.toFixed(i?1:0)+' '+u[i]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(url,opt={})=>{const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Terjadi kesalahan'),{status:r.status});return d};

let mode='login';
$('#authSwitch').onclick=()=>{mode=mode==='login'?'register':'login';$('#authTitle').textContent=$('#authBtn').textContent=mode==='login'?'Masuk':'Daftar';$('#authSwitch').textContent=mode==='login'?'Belum punya akun? Daftar':'Sudah punya akun? Masuk'};
$('#authBtn').onclick=async()=>{try{await api('/api/'+mode,{method:'POST',body:JSON.stringify({username:$('#u').value,password:$('#p').value})});start()}catch(e){$('#authErr').textContent=e.message}};
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.href='/'};

async function start(){
  try{const me=await api('/api/me');$('#authBox').classList.add('hide');$('#app').classList.remove('hide');$('#who').classList.remove('hide');$('#uname').textContent=me.username;refresh()}
  catch{$('#authBox').classList.remove('hide')}
  const q=new URLSearchParams(location.search);if(q.get('error'))$('#topErr').textContent=q.get('error');
}
async function refresh(){loadAccounts();loadFiles()}

async function loadAccounts(){
  const list=await api('/api/accounts');
  let used=0,lim=0,unl=false;
  $('#accounts').innerHTML=list.length?list.map(a=>{
    if(!a.ok)return`<div class="row"><div class="grow"><div class="name">${esc(a.email)}</div><div class="err">Akses ditolak atau kedaluwarsa. Hubungkan ulang.</div></div><button class="ghost" data-rm="${a.id}">Lepas</button></div>`;
    used+=a.usage;if(a.limit===null)unl=true;else lim+=a.limit;
    const pct=a.limit?Math.min(100,a.usage/a.limit*100):0;
    return`<div class="row"><div class="grow"><div class="name">${esc(a.email)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="mute">${fmt(a.usage)} terpakai dari ${a.limit===null?'tanpa batas':fmt(a.limit)}</div></div><button class="ghost" data-rm="${a.id}">Lepas</button></div>`}).join('')
    :'<p class="mute">Belum ada akun. Hubungkan akun Google pertama Anda.</p>';
  $('#total').textContent=unl?fmt(used)+' terpakai':fmt(lim-used)+' tersisa';
  $('#totalBar').style.width=(!unl&&lim?Math.min(100,used/lim*100):0)+'%';
  $('#totalNote').textContent=list.length?`${list.length} drive digabung · ${fmt(used)} terpakai${unl?'':' dari '+fmt(lim)}`:'';
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(confirm('Lepas akun ini? File di dalamnya tidak dihapus dari Google Drive, tetapi tidak tampil lagi di sini.')){await api('/api/accounts/'+b.dataset.rm,{method:'DELETE'});refresh()}});
}
async function loadFiles(){
  const list=await api('/api/files');
  $('#files').innerHTML=list.length?list.map(f=>`<div class="row"><div class="grow"><div class="name">${esc(f.name)}</div><div class="mute">${fmt(f.size)} · disimpan di ${esc(f.drive||'akun yang sudah dilepas')}</div></div><a class="btn" href="/api/files/${f.id}/download">Unduh</a><button class="ghost" data-del="${f.id}">Hapus</button></div>`).join('')
    :'<p class="mute">Belum ada file. Unggah file pertama di atas.</p>';
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus file ini dari Google Drive?')){try{await api('/api/files/'+b.dataset.del,{method:'DELETE'});refresh()}catch(e){$('#topErr').textContent=e.message}}});
}

async function send(file){
  try{
    const init=await api('/api/uploads/init',{method:'POST',body:JSON.stringify({name:file.name,size:file.size,mime:file.type})});
    const done=await new Promise((ok,fail)=>{
      const x=new XMLHttpRequest();
      x.open('PUT',init.uploadUrl);
      x.upload.onprogress=e=>{if(e.lengthComputable)$('#prog').textContent=`Mengunggah ${file.name}: ${Math.round(e.loaded/e.total*100)}%`};
      x.onload=()=>{if(x.status<300){try{ok(JSON.parse(x.responseText))}catch{fail(new Error('Respons Google tidak terbaca'))}}else fail(new Error('Google menolak upload (kode '+x.status+')'))};
      x.onerror=()=>fail(new Error('Koneksi ke Google terputus'));
      x.send(file);
    });
    await api('/api/files/complete',{method:'POST',body:JSON.stringify({accountId:init.accountId,driveFileId:done.id})});
    $('#prog').textContent=`${file.name} tersimpan di ${init.drive}`;
  }catch(e){$('#prog').innerHTML=`<span class="err">${esc(file.name)}: ${esc(e.message)}</span>`}
}
async function sendAll(files){for(const f of files)await send(f);refresh()}
const drop=$('#drop');
drop.onclick=()=>$('#file').click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('#file').click()};
$('#file').onchange=e=>sendAll([...e.target.files]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');sendAll([...e.dataTransfer.files])};
start();
</script>
</body>
</html>
